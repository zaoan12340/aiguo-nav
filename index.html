<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>爱过天下</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
    background:#0f0f0f;
    color:#eee;
    font-family:Microsoft Yahei;
    padding:30px 20px;
}
.head{
    text-align:center;
    padding:20px 0 40px;
}
/* 新增圆形图片样式 */
.circle-img{
    width: 180px;
    height: 180px;
    border-radius: 50%;
    object-fit: cover;
    margin-bottom: 16px;
    border: 2px solid #444;
}
.head h1{
    font-size:26px;
    margin-bottom:8px;
}
.head p{
    color:#999;
}
.box{
    max-width:900px;
    margin:0 auto;
}
.title{
    font-size:18px;
    margin:25px 0 15px;
    padding-bottom:6px;
    border-bottom:1px solid #222;
}
.link-group{
    display:grid;
    grid-template-columns: repeat(auto-fill,minmax(180px,1fr));
    gap:12px;
}
.item{
    background:#1e1e1e;
    padding:16px;
    border-radius:10px;
    text-decoration:none;
    color:#fff;
    transition:0.2s;
    text-align:center;
}
.item:hover{
    background:#2d2d2d;
    transform:translateY(-2px);
}
.foot{
    text-align:center;
    margin-top:60px;
    color:#666;
    font-size:14px;
}
</style>
</head>
<body>
<div class="head">
    <!-- 圆形logo图片 -->
    <img class="circle-img" src="https://ibb.co/Fbt8btjT" alt="logo">
    <h1>爱过天下</h1>
    <p>跟对人做对事</p>
</div>

<div class="box">
    <div class="title">主推</div>
    <div class="link-group">
        <a href="https://ibb.co/hJX7QVTy" target="_blank" class="item">【8.3开业】纵横国际</a>
        <a href="https://ibb.co/4ZP9FH1j" target="_blank" class="item">汇赢国际</a>
        <a href="https://ibb.co/LdrdryB1" target="_blank" class="item">龙腾国际</a>
    </div>
</div>

<div class="foot">
Copyright © 2026 爱过天下
</div>
</body>
</html>
