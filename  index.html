<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>爱过天下</title>
<meta name="description" content="跟对人做对事">
<meta property="og:title" content="爱过天下">
<meta property="og:description" content="跟对人做对事">
<meta property="og:type" content="website">
<meta name="robots" content="index, follow">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --primary: #111111;
  --primary-light: rgba(17,17,17,0.08);
  --bg: #0a0a0a;
  --card-bg: #1a1a1a;
  --text: #e0e0e0;
  --text-secondary: #a0a0a0;
  --text-light: #B0B8C5;
  --border: #2a2a2a;
  --shadow: 0 2px 12px rgba(0,0,0,0.3);
  --shadow-hover: 0 6px 24px rgba(0,0,0,0.10);
  --radius: 12px;
  --radius-sm: 8px;
  --transition: 0.2s ease;
  --max-width: 1200px;
  --header-bg: linear-gradient(135deg, #333333 0%, #1a1a1a 100%);
  --header-text: #ffffff;
}
html { scroll-behavior: smooth; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
  min-height: 100vh;
  min-height: 100dvh;
}
.header {
  background: var(--header-bg);
  color: var(--header-text);
  padding: 24px 0 20px;
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: 0 2px 16px rgba(17,17,17,0.25);
}
.header-inner {
  max-width: var(--max-width);
  margin: 0 auto;
  padding: 0 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.logo { display: flex; align-items: center; gap: 10px; }
.logo-icon { font-size: 28px; }
.logo h1 { font-size: 22px; font-weight: 700; letter-spacing: 1px; }
.logo-sub {
  font-size: 13px;
  opacity: 0.85;
  background: rgba(255,255,255,0.2);
  padding: 2px 10px;
  border-radius: 20px;
  margin-left: 4px;
}
.nav-container { max-width: var(--max-width); margin: 0 auto; padding: 24px; }
.nav-section { margin-bottom: 32px; }
.nav-section-title {
  font-size: 17px;
  font-weight: 700;
  color: var(--text);
  margin-bottom: 16px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.nav-section-title::after {
  content: "";
  flex: 1;
  height: 1px;
  background: var(--border);
  margin-left: 8px;
}
.nav-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 14px;
}
.nav-card {
  background: var(--card-bg);
  border-radius: var(--radius);
  padding: 18px 20px;
  display: flex;
  align-items: center;
  gap: 14px;
  text-decoration: none;
  color: var(--text);
  box-shadow: var(--shadow);
  transition: all var(--transition);
  border: 1px solid transparent;
  cursor: pointer;
}
.nav-card:hover {
  transform: translateY(-2px);
  box-shadow: var(--shadow-hover);
  border-color: var(--primary-light);
}
.nav-card-icon {
  width: 44px;
  height: 44px;
  border-radius: 10px;
  background: var(--primary-light);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
  flex-shrink: 0;
  overflow: hidden;
  position: relative;
}
.nav-favicon {
  width: 24px;
  height: 24px;
  border-radius: 4px;
  position: absolute;
  z-index: 1;
}
.nav-fallback { position: absolute; z-index: 0; font-size: 22px; }
.nav-card-info { flex: 1; min-width: 0; }
.nav-card-name {
  font-size: 15px;
  font-weight: 600;
  margin-bottom: 2px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.footer {
  text-align: center;
  padding: 40px 24px;
  color: var(--text-secondary);
  font-size: 14px;
}
</style>
</head>
<body>

<header class="header">
<div class="header-inner">
<div class="logo">
<span class="logo-icon">⚡</span>
<h1>爱过天下</h1>
<span class="logo-sub">跟对人做对事</span>
</div>
</div>
</header>

<div class="nav-container" id="navContainer"></div>

<footer class="footer">
<p>爱过天下 &copy; 2026</p>
</footer>

<script>
// 导航配置，这里可以后续自由加更多网站
const navData = [
  {
    categoryIcon: '🌐',
    categoryName: '内容纵横国际',
    sites: [
      { name: '纵横国际', desc: '跳转QQ官网', url: 'https://qq.com' }
    ]
  }
];

(function() {
  var navContainer = document.getElementById('navContainer');

  function renderNav() {
    var html = '';
    navData.forEach(function(section) {
      var catLabel = (section.categoryIcon || '') + ' ' + (section.categoryName || '');
      html += '<div class="nav-section">';
      html += '<h2 class="nav-section-title">' + escapeHtml(catLabel) + '</h2>';
      html += '<div class="nav-grid">';
      section.sites.forEach(function(site) {
        var domain = getDomain(site.url);
        html += '<a href="' + escapeAttr(site.url) + '" target="_blank" class="nav-card">';
        html += '<div class="nav-card-icon">';
        html += '<img src="https://favicon.im/' + escapeAttr(domain) + '?size=64" alt="" class="nav-favicon" onerror="this.style.display=&quot;none&quot;">';
        html += '<span class="nav-fallback">🌐</span>';
        html += '</div>';
        html += '<div class="nav-card-info">';
        html += '<div class="nav-card-name">' + escapeHtml(site.name) + '</div>';
        html += '</div>';
        html += '</a>';
      });
      html += '</div></div>';
    });
    navContainer.innerHTML = html;
  }

  function getDomain(url) {
    try { return new URL(url).hostname.replace('www.', ''); } catch(e) { return url; }
  }

  function escapeAttr(str) {
    if (!str) return '';
    return String(str).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function escapeHtml(str) {
    if (!str) return '';
    return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  renderNav();
})();
</script>
</body>
</html>
